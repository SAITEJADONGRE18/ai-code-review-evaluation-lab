[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-lab"
version = "0.1.0"
description = "A small CLI for validating structured AI code-review evaluations and scoring a transparent rubric."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Project Author" }]
dependencies = []

[project.scripts]
code-review-lab = "code_review_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
